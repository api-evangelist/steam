principles:
  - name: Visibility
    description: >-
      Pull the monthly Steamworks revenue report and Steam Direct submission ledger. Reconcile each game's reported gross to your own analytics; track Steam Wallet net deductions (refunds, chargebacks, marketplace fees) line-by-line.
  - name: Allocation
    description: >-
      Allocate Steam payouts and submission fees per product / studio / publisher entity in your finance system; track Web API call volume per API key for ops attribution.
  - name: Optimization
    description: >-
      Use the Steamworks discounting and bundle tooling deliberately; minimize refunds with clear store-page expectations; consider promotional Steam Sale calendar timing; recoup the $100 Steam Direct fee promptly by promoting first-week sales above $1K.
  - name: Accountability
    description: >-
      Assign a Steamworks publisher account owner; monitor Steam Direct submission lifecycle, payout timeliness, and Web API key rotation; review the Steam Distribution Agreement at every renewal/amendment.
