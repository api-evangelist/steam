description: >-
  Steam does not charge a per-call fee for the Steamworks Web API. Access is gated by a free Steam Web API Key (any Steam user) for the public read-only interfaces, and by a Steamworks publisher account for partner-restricted interfaces. Valve monetizes via a non-recurring $100 USD Steam Direct submission fee per product (recoupable once the product passes $1,000 in adjusted gross revenue) and via revenue share on store sales (commonly described as 30/25/20 across published volume tiers, with Valve's share decreasing as a title's gross sales pass $10M and $50M). Players pay nothing to use the Steam Community Web API beyond owning a Steam account.
notes: >-
  Reconciled at the model level on 2026-05-08 against the partner.steamgames.com/steamdirect documentation. The exact revenue-share tiers are documented in the Steam Distribution Agreement, not on a public price page; the values shown here are commonly referenced and accurate as of the most recent public Valve communications. Steam Web API rate limits are documented in the rate-limits artifact.
sources:
  - https://partner.steamgames.com/steamdirect
  - https://partner.steamgames.com/doc/webapi
  - https://steamcommunity.com/dev
  - https://store.steampowered.com/subscriber_agreement/
plans:
  - id: steam-public-web-api
    name: Public Steam Web API
    type: free
    description: >-
      Any Steam user can register a free Web API key at steamcommunity.com/dev/apikey to call the public, read-only interfaces (ISteamUser, ISteamUserStats, ISteamNews, IPlayerService, etc.). No fee, but subject to the Steam Web API Terms of Use.
    entries:
      - label: Web API Key
        name: web_api_key
        type: flat
        metric: account
        limit: 1
        timeFrame: lifetime
        geo: global
        unit: 1
        price: 0
        currency: USD
        userMultiplied: false
    elements:
      - name: Free API Key
      - name: Public Read-Only Interfaces
      - name: 100K Calls / Day Soft Limit
  - id: steam-direct-publisher
    name: Steam Direct (Game Publisher)
    type: paid
    description: >-
      Submit a game to the Steam store via Steam Direct. A non-refundable $100 USD submission fee is charged per product, recoupable from earnings once the product reaches $1,000 in adjusted gross revenue. Publishers receive a Steamworks partner account with access to partner-restricted Web API interfaces (ISteamMicroTxn, IInventoryService, IGameInventory, ISteamCheckout, etc.).
    entries:
      - label: Submission Fee Per Product
        name: steam_direct_fee
        type: flat
        metric: product
        limit: 1
        timeFrame: per-product
        geo: global
        unit: 1
        price: 100
        currency: USD
        userMultiplied: false
    elements:
      - name: Steamworks Publisher Account
      - name: Partner-Restricted Web APIs
      - name: Microtransaction Support
      - name: Inventory + Workshop Tooling
      - name: Recoupable from First $1K Adjusted Gross Revenue
  - id: steam-revenue-share
    name: Steam Distribution Revenue Share
    type: revenue-share
    description: >-
      Valve takes a graduated share of store sales. The commonly cited tiers are 30% on the first $10M of a title's lifetime gross, 25% on $10M-$50M, and 20% above $50M. Exact terms are in the Steam Distribution Agreement.
    entries:
      - label: Tier 1 — 0 to $10M Adjusted Gross
        name: tier_0_to_10m
        type: percent
        metric: revenue
        limit: -1
        timeFrame: lifetime
        geo: global
        unit: 1
        price: 30
        currency: '%'
        userMultiplied: false
      - label: Tier 2 — $10M to $50M Adjusted Gross
        name: tier_10m_to_50m
        type: percent
        metric: revenue
        limit: -1
        timeFrame: lifetime
        geo: global
        unit: 1
        price: 25
        currency: '%'
        userMultiplied: false
      - label: Tier 3 — Above $50M Adjusted Gross
        name: tier_above_50m
        type: percent
        metric: revenue
        limit: -1
        timeFrame: lifetime
        geo: global
        unit: 1
        price: 20
        currency: '%'
        userMultiplied: false
    elements:
      - name: Graduated Revenue Share
      - name: Valve Pays Net of Refunds and Chargebacks
